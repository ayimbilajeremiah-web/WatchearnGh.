<!DOCTYPE html>
<html>
<head>
  <title>Register - WatchearnGh</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <div class="content">
      <h2>📝 Create Account</h2>
      <p>Join WatchearnGh and start earning</p>
      
      <input type="text" id="name" placeholder="Full Name" style="width:100%; padding:12px; margin:10px 0; border-radius:5px; border:1px solid #333; background:#111; color:white;">
      
      <input type="tel" id="phone" placeholder="Phone Number" style="width:100%; padding:12px; margin:10px 0; border-radius:5px; border:1px solid #333; background:#111; color:white;">
      
      <input type="password" id="password" placeholder="Password" style="width:100%; padding:12px; margin:10px 0; border-radius:5px; border:1px solid #333; background:#111; color:white;">
      
      <button onclick="registerUser()">Create Account</button>
      
      <p style="margin-top:20px;">Already have an account? <a href="login.html" style="color:#00ff88;">Login</a></p>
    </div>
  </div>

  <script>
    function registerUser() {
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      
      if(name && phone) {
        alert('Account created! Welcome ' + name);
        window.location.href = 'dashboard.html';
      } else {
        alert('Please fill all fields');
      }
    }
  </script>
</body>
</html>
