<!DOCTYPE html>
<html>
<head>
  <title>Register - WatchearnGh</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <div class="content">
      <h2>📝 Create Account</h2>
      <p>Join WatchearnGh and start earning</p>
      
      <input type="text" id="name" placeholder="Full Name" style="width:100%; padding:12px; margin:10px 0; border-radius:5px; border:1px solid #333; background:#111; color:white;">
      
      <input type="tel" id="phone" placeholder="Phone Number" style="width:100%; padding:12px; margin:10px 0; border-radius:5px; border:1px solid #333; background:#111; color:white;">
      
      <input type="password" id="password" placeholder="Password" style="width:100%; padding:12px; margin:10px 0; border-radius:5px; border:1px solid #333; background:#111; color:white;">
      
      <button onclick="registerUser()">Create Account</button>
      
      <p style="margin-top:20px;">Already have an account? <a href="login.html" style="color:#00ff88;">Login</a></p>
    </div>
  </div>

  <script>
    function registerUser() {
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      
      if(name && phone) {
        alert('Account created! Welcome ' + name);
        window.location.href = 'dashboard.html';
      } else {
        alert('Please fill all fields');
      }
    }
  </script> 
  <!-- BACKGROUND MUSIC -->
<audio id="bgmusic" loop>
  <source src="music.mp3" type="audio/mpeg">
  Your browser does not support audio.
</audio>

<button id="musicBtn" onclick="toggleMusic()" style="position:fixed;bottom:70px;right:15px;background:#00c853;color:white;border:none;border-radius:50%;width:50px;height:50px;font-size:20px;z-index:999;">🔇</button>

<script>
let music = document.getElementById('bgmusic');
let btn = document.getElementById('musicBtn');
let playing = false;

function toggleMusic(){
  if(playing){
    music.pause();
    btn.innerHTML = '🔇';
    playing = false;
  } else {
    music.play();
    btn.innerHTML = '🔊';
    playing = true;
  }
}
</script> 

</body>
</html>
