
<!DOCTYPE html>
<html>
<head>
  <title>Earn - Watchearn GH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{background:#0a1a2a;color:#fff;font-family:Arial;text-align:center;padding:20px}
    .navbar{background:#000;padding:15px;margin:-20px -20px 20px -20px}
    .navbar a{color:white;margin:10px;text-decoration:none}
    .video-box{background:#1a2a3a;padding:20px;border-radius:12px;margin:20px auto;max-width:500px}
    video{width:100%;border-radius:10px}
    .btn{background:#00c853;color:white;padding:12px 25px;border:none;border-radius:8px;font-size:16px;cursor:pointer}
    #timer{font-size:18px;color:#ffc107;margin:10px}
    #balance{font-size:24px;color:#00c853}
  </style>
</head>
<body>
  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="dashboard.html">Earn</a>
  </div>

  <h1>Your Balance: <span id="balance">0.00</span> GHS</h1>

  <div class="video-box">
    <h3>Watch & Earn 0.10GHS</h3>
    <video id="earnVideo" controls></video>
    <p id="timer">Click "Play Video" to start</p>
    <button class="btn" onclick="playRandomVideo()">▶️ Play Video</button>
  </div>

<script>
  let balance = parseFloat(localStorage.getItem('balance')) || 0;
  document.getElementById('balance').innerText = balance.toFixed(2);

  const videos = [
    "videos/video1.mp4",
    "videos/video2.mp4", 
    "videos/video3.mp4"
  ];

  function playRandomVideo(){
    let randomVid = videos[Math.floor(Math.random() * videos.length)];
    let vid = document.getElementById('earnVideo');
    vid.src = randomVid;
    vid.play();

    let timeLeft = 30;
    document.getElementById('timer').innerText = "Watch for " + timeLeft + "s";
    
    let countdown = setInterval(() => {
      timeLeft--;
      document.getElementById('timer').innerText = "Watch for " + timeLeft + "s";
      
      if(timeLeft <= 0){
        clearInterval(countdown);
        balance += 0.10;
        localStorage.setItem('balance', balance);
        document.getElementById('balance').innerText = balance.toFixed(2);
        document.getElementById('timer').innerText = "+0.10GHS Added! Click Play Again";
        vid.pause();
      }
    }, 1000);
  }
</script>
</body>
  </html>
