
   
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - WatchearnGh</title>
<style>
  body {background:#000; color:#fff; font-family:Arial; margin:0; padding:20px; text-align:center;}
  
  .logo {width:80px; height:80px; margin:10px auto; background:linear-gradient(135deg,#00ff00,#00aa00); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:bold; color:#000;}
  
  h2 {color:#00ff00; margin:10px 0;}
  .stats {text-align:left; background:#111; padding:15px; border-radius:10px; margin:15px 0;}
  .stats p {margin:8px 0; font-size:15px;}
  
  .btn {display:block; width:95%; margin:10px auto; padding:14px; background:#00ff00; color:#000; border:none; border-radius:8px; font-weight:bold; font-size:16px; text-decoration:none;}
  .btn-secondary {background:#333; color:#00ff00;}
  
  .invite-card {background:#111; border:1px solid #00ff00; padding:15px; border-radius:10px; margin-top:20px; text-align:left;}
  .invite-card input {width:95%; padding:10px; margin:8px 0; border:none; border-radius:5px;}
</style>
</head>
<body>
  <div class="logo">WG</div>
  <h2>👋 Welcome Back!</h2>
  
  <div class="stats">
    <p>💰 <b>Balance:</b> GH₵0.00</p>
    <p>🎬 <b>Videos Watched:</b> 0</p>
    <p>🏆 <b>Total Earned:</b> GH₵0.00</p>
  </div>
  
  <a href="#" class="btn">📺 Watch Videos & Earn</a>
  <a href="index.html" class="btn btn-secondary">🏠 Back to Home</a>
  
  <div class="invite-card">
    <h3>🎁 Invite Friends & Earn GH₵1.00</h3>
    <p>Share this link:</p>
    <input type="text" value="https://watchearn-gh.vercel.app" readonly id="refLink">
    <button class="btn" onclick="copyLink()">Copy Link</button>
  </div>

<script>
function copyLink(){
  navigator.clipboard.writeText(document.getElementById('refLink').value);
  alert('Link Copied!');
}
</script>
</body>
</html>
