<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WatchEarn GH - Dashboard</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: #fff;
    padding-bottom: 80px;
  }
  .navbar {
    background: #1a1a1a;
    padding: 15px;
    display: flex;
    align-items: center;
    border-bottom: 2px solid #00c853;
  }
  .navbar .logo {
    font-size: 20px;
    font-weight: bold;
    color: #00c853;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .navbar .logo img {
    width: 35px;
    height: 35px;
    border-radius: 50%;
  }
  .box {
    background: #1a1a1a;
    margin: 20px;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 10px rgba(0,200,83,0.2);
  }
  .box h3 { color: #00c853; margin-top: 0; }
  .balance { font-size: 28px; font-weight: bold; color: #00c853; }
  .btn {
    background: #00c853; color: #fff; border: none;
    padding: 12px 20px; border-radius: 10px;
    font-size: 16px; width: 100%; cursor: pointer; margin-top: 10px;
  }
  .btn:disabled { background: #555; cursor: not-allowed; }
  #musicBtn {
    position: fixed; bottom: 20px; right: 20px;
    width: 50px; height: 50px; border-radius: 50%;
    background: #00c853; color: #fff; border: none;
    font-size: 20px; cursor: pointer; z-index: 999;
  }
</style>
</head>
<body>

<div class="navbar">
  <div class="logo">
    <img src="images/logo.png" alt="Logo"> WATCHEARN GH
  </div>
</div>

<div class="box">
  <h3>Your Balance</h3>
  <p class="balance">0.00 GHS</p>

  <h3>Watch Videos & Earn 0.10GHS</h3>

  <video id="earnVideo" width="100%" controls playsinline style="border-radius:10px;margin:10px 0;">
    <source src="video.mp4" type="video/mp4">
    Your browser does not support video.
  </video>
  <p style="font-size:12px;color:#aaa;text-align:center;">Tap 🔊 below to play background music</p>

  <button id="claimBtn" class="btn" onclick="claimReward()" disabled>
    Watch video to unlock
  </button>
</div>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>
<button id="musicBtn" onclick="toggleMusic()">🔇</button>

<script>
  let video = document.getElementById('earnVideo');
  let claimBtn = document.getElementById('claimBtn');
  let watched = false;

  video.onended = function() {
    watched = true;
    claimBtn.disabled = false;
    claimBtn.style.background = '#00c853';
    claimBtn.innerHTML = '✅ Claim 0.10GHS';
  };

  function claimReward() {
    if(watched){
      alert("You earned 0.10GHS!");
      watched = false;
      claimBtn.disabled = true;
      claimBtn.style.background = '#555';
      claimBtn.innerHTML = 'Watch video again';
      video.currentTime = 0;
    }
  }

  let music = document.getElementById('bgMusic');
  let musicBtn = document.getElementById('musicBtn');
  let isPlaying = false;

  function toggleMusic() {
    if (isPlaying) {
      music.pause();
      musicBtn.innerHTML = '🔇';
      isPlaying = false;
    } else {
      music.play();
      musicBtn.innerHTML = '🔊';
      isPlaying = true;
    }
  }
</script>

</body>
</html>
