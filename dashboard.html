
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WatchearnGh - Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .balance {
      background: #00ff00;
      color: #000;
      padding: 20px;
      border-radius: 15px;
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0;
    }
    .watch-btn {
      background: #00ff00;
      color: #000;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Welcome to WatchearnGh</h1>
  
  <div class="balance">
    Balance: GH₵ 0.00
  </div>

  <button class="watch-btn" onclick="alert('Ad will play here')">Watch Ad + GH₵5</button>

  <!-- ALL YOUR OTHER DASHBOARD CONTENT GOES HERE -->


<!-- ===== BACKGROUND MUSIC CODE START ===== -->
<!-- Music Player -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
  Your browser does not support audio
</audio>

<!-- Music On/Off Button -->
<button onclick="toggleMusic()" id="musicBtn" style="background:#00ff00; color:#000; border:none; padding:10px 15px; border-radius:20px; position:fixed; top:15px; right:15px; z-index:999; font-weight:bold; cursor:pointer;">
  🔊 ON
</button>

<script>
let music = document.getElementById('bgMusic');
let btn = document.getElementById('musicBtn');

// Phones need 1 click to start music
document.addEventListener('click', function startOnce() {
  music.play().catch(()=>{});
  document.removeEventListener('click', startOnce);
}, {once: true});

function toggleMusic() {
  if(music.paused) {
    music.play(); 
    btn.innerHTML = "🔊 ON";
  } else {
    music.pause(); 
    btn.innerHTML = "🔇 OFF";
  }
}
</script>
<!-- ===== BACKGROUND MUSIC CODE END ===== -->

</body>
</html>
