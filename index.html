
<!DOCTYPE html>
<html>
<head>
  <title>Watchearn GH - Watch & Earn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- ADS CODE -->
  <script src='https://adsgram.ai/js/adsgram.js'></script>
  <script src='//monetag.com/js/p.js' data-zone='PUT_MONETAG_ID'></script>
  
  <style>
    body { font-family: Arial; background: #111; color: white; text-align: center; padding: 15px; }
    .box { background: #222; padding: 15px; border-radius: 10px; margin: 15px 0; }
    button { display:block; margin:10px auto; padding:15px; width:95%; background:#25D366; color:white; border:none; border-radius:10px; font-size:16px; font-weight:bold; }
    button:disabled { background:gray; }
    input, select { padding:12px; width:90%; margin:5px 0; border-radius:8px; border:none; }
    video { width:100%; border-radius:10px; margin-top:15px; }
    #timer { font-size:20px; color:yellow; }
  </style>
</head>
<body>
  <h1>Watchearn GH 🇬🇭</h1>

  <!-- BALANCE -->
  <div class="box">
    <h2>Your Balance: <span id="balance">0.00</span>GHS</h2>
    <p>Watch full 30s to earn 0.10GHS</p>
    <p>Minimum Withdraw: 5.00GHS</p>
  </div>

  <!-- PROPELLER AD -->
  <div id="propeller-zone-PUT_PROPELLER_ID"></div>
  <script async src="//ads.propellerads.com/ads.js"></script>

  <!-- VIDEOS -->
  <h3>Choose Video</h3>
  <button onclick="startEarning('videos/video1.mp4')">▶️ Video 1</button>
  <button onclick="startEarning('videos/video2.mp4')">▶️ Video 2</button>
  <button onclick="startEarning('videos/video3.mp4')">▶️ Video 3</button>
  <!-- Copy this for 100 videos -->

  <video id="earnVideo" controls></video>
  <p id="timer"></p>

  <!-- WITHDRAW -->
  <div class="box">
    <h2>Withdraw to Mobile Money</h2>
    <input type="text" id="momoNumber" placeholder="024xxxxxxx">
    <select id="network">
      <option>MTN MoMo</option>
      <option>Telecel Cash</option>
      <option>Vodafone Cash</option>
    </select>
    <button onclick="requestWithdrawal()" style="background:#007bff;">Request Cashout to WhatsApp</button>
  </div>

<script>
let balance = parseFloat(localStorage.getItem('balance')) || 0;
document.getElementById('balance').innerText = balance.toFixed(2);

function startEarning(videoFile){
  // SHOW AD FIRST
  window.Adsgram.init({blockId: "PUT_ADSGRAM_ID"}).show().then(() => {
    let vid = document.getElementById('earnVideo');
    vid.src = videoFile;
    vid.play();
    
    let timeLeft = 30; // Must watch 30s
    document.getElementById('timer').innerText = "Watch for " + timeLeft + "s";
    
    let countdown = setInterval(() => {
      timeLeft--;
      document.getElementById('timer').innerText = "Watch for " + timeLeft + "s";
      if(timeLeft <= 0){
        clearInterval(countdown);
        balance += 0.10;
        localStorage.setItem('balance', balance);
        document.getElementById('balance').innerText = balance.toFixed(2);
        document.getElementById('timer').innerText = "+0.10GHS Added!";
      }
    }, 1000);
  });
}

function requestWithdrawal(){
  let num = document.getElementById('momoNumber').value;
  let net = document.getElementById('network').value;
  let yourWhatsApp = "233500609622"; // <-- YOUR NUMBER IS HERE
  
  if(num.length < 10){ alert("Enter correct MoMo number"); return; }
  if(balance < 5){ alert("Minimum 5.00GHS to withdraw"); return; }
  
  // OPEN WHATSAPP WITH MESSAGE
  let message = `🔥 NEW WITHDRAWAL REQUEST 🔥%0A%0AAmount: ${balance.toFixed(2)}GHS%0AMoMo Number: ${num}%0ANetwork: ${net}%0ATime: ${new Date().toLocaleString()}`;
  window.open(`https://wa.me/${yourWhatsApp}?text=${message}`, '_blank');
  
  alert("Request sent! I will send your money in 24hrs");
  
  balance = 0;
  localStorage.setItem('balance', balance);
  document.getElementById('balance').innerText = balance.toFixed(2);
}
</script>
</body>
</html>
